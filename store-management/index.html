<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyNutrition Store Management</title>
    <link rel="stylesheet" href="./store-management.css?v=public-slideshow-1">
  </head>
  <body>
    <main>
      <h1>MyNutrition Store Management</h1>
      <p>Changes affect real stores. Ask affected users to stop making changes until you are finished.</p>
      <section>
        <h2>Stores</h2>
        <p>Choose which stores appear in the public slideshow. Stores are private there until added.</p>
        <button id="refresh" type="button">Refresh stores</button>
        <ul id="stores"></ul>
      </section>
      <section>
        <h2>Add a store</h2>
        <form id="add-form">
          <label>Store name <input id="name" maxlength="200" required></label>
          <label>Owner email <input id="owner" type="email" required></label>
          <button type="submit">Add store</button>
        </form>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./store-management.js?v=public-slideshow-1"></script>
  </body>
</html>
